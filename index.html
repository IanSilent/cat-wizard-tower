<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Башня кота-волшебника</title>
<style>
  html, body { margin: 0; height: 100%; background: #17110e; overflow: hidden;
    font-family: Georgia, 'Palatino Linotype', serif; color: #4a3424; user-select: none; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px;
    transform: translate(-50%, -50%); border-radius: 18px; overflow: hidden; }
  #cv { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; touch-action: none; }
  .parch { background: #f3e6c8; border: 2px solid #b08d57; border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  #btns { position: absolute; right: 16px; top: 36px; display: flex; gap: 8px; }
  button { font: 16px Georgia, serif; color: #4a3424; background: #f3e6c8; border: 2px solid #b08d57;
    border-radius: 12px; padding: 8px 14px; cursor: pointer; transition: transform .15s, background .15s; }
  button:hover:not(:disabled) { background: #fff4d6; transform: translateY(-1px); }
  button:disabled { opacity: .55; cursor: default; }
  #card { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: 640px;
    padding: 12px 22px; font-size: 18px; line-height: 1.4; text-align: center; pointer-events: none;
    transition: opacity .4s; }
  #card i { color: #6b4a30; }
  .chip { display: inline-block; padding: 1px 10px; border-radius: 10px; color: #fff; font-style: normal; }
  #toast { position: absolute; left: 50%; top: 112px; transform: translateX(-50%); padding: 10px 20px;
    font-size: 17px; pointer-events: none; opacity: 0; transition: opacity .6s; max-width: 560px; text-align: center; }
  #eve { position: absolute; left: 400px; top: 270px; width: 400px; padding: 22px 26px; text-align: center;
    font-size: 18px; line-height: 1.5; display: none; }
  #eve h2 { margin: 0 0 8px; font-weight: normal; font-style: italic; font-size: 28px; }
  #eve button { margin-top: 14px; font-size: 18px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="btns">
    <button id="bArt"></button>
    <button id="bTower"></button>
    <button id="bMute" title="Звук">♪</button>
    <button id="bReset" title="Начать заново">⟲</button>
  </div>
  <div id="toast" class="parch"></div>
  <div id="card" class="parch"></div>
  <div id="eve" class="parch"></div>
</div>
<script>
'use strict';
const W = 1280, H = 720, PI = Math.PI;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2);
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------- данные ---------- */
const SCHOOLS = {
  moon:  { name: 'Луны',  col: '#6f8fc9', dark: '#46609a' },
  leaf:  { name: 'Листа', col: '#7fa86a', dark: '#4f7340' },
  flame: { name: 'Очага', col: '#d98a4e', dark: '#a15a2a' },
  star:  { name: 'Звёзд', col: '#a583c4', dark: '#6f5290' },
};
const LEVEL_SCHOOL = { 2: 'flame', 3: 'star' };
const penta = [0, 2, 4, 1, 3, 0].map(i => {
  const a = -PI / 2 + i * 2 * PI / 5; return [Math.cos(a) * .85, Math.sin(a) * .85];
});
const SEALS = [
  { school: 'leaf',  name: 'Росток', lvl: 1, pts: [[0,-.8],[.7,.6],[-.7,.6],[0,-.8]] },
  { school: 'moon',  name: 'Серп',   lvl: 1, pts: [[.3,-.8],[-.5,-.45],[-.7,.2],[-.2,.75],[.5,.6],[0,.1],[.3,-.8]] },
  { school: 'flame', name: 'Очаг',   lvl: 2, pts: [[-.6,.7],[-.6,-.1],[0,-.8],[.6,-.1],[.6,.7],[-.6,.7]] },
  { school: 'leaf',  name: 'Лист',   lvl: 2, pts: [[-.75,.6],[-.35,-.55],[0,.3],[.35,-.55],[.75,.6]] },
  { school: 'moon',  name: 'Капля',  lvl: 3, pts: [[0,-.85],[.55,.1],[.35,.65],[-.35,.65],[-.55,.1],[0,-.85]] },
  { school: 'star',  name: 'Звезда', lvl: 3, pts: penta },
];
const ORDERS = {
  moon:  ['печать, чтобы луна светила в окно потише', 'печать от скрипа ночных половиц', 'печать для снов про рыбу'],
  leaf:  ['печать от сырости в погребе', 'печать, чтобы тыквы росли круглее', 'печать для мха на северной стене'],
  flame: ['печать, чтобы чайник не убегал', 'печать тёплых носков', 'печать для пирога, который не подгорает'],
  star:  ['печать, чтобы звёзды не сыпались в трубу', 'печать для потерянной кометы', 'печать от слишком громкой тишины'],
};
const SENDERS = ['Тётушка Примула с Холма', 'Мельник Бобо', 'Сова-почтмейстер', 'Гном из погреба', 'Соседский ёж'];
const ARTS = [
  { n: 'Коврик у камина', x: 1030, y: 640, r: 90 },
  { n: 'Парящие свечи', x: 560, y: 335, r: 30 },
  { n: 'Поющий кактус', x: 565, y: 250, r: 34 },
  { n: 'Глобус неизвестных земель', x: 555, y: 440, r: 30 },
  { n: 'Гриб-ночник', x: 480, y: 530, r: 34 },
  { n: 'Хрустальный шар', x: 970, y: 298, r: 26 },
  { n: 'Телескоп', x: 868, y: 490, r: 46 },
  { n: 'Часы с рыбой', x: 1030, y: 195, r: 40 },
];
const TOWER_COST = [25, 60];
const artCost = () => 6 + 2 * S.arts;

/* ---------- состояние ---------- */
const KEY = 'catWizardTower.v1';
function fresh() {
  return { day: 1, done: 0, dust: 0, level: 1, arts: 0, nid: 5, phase: 'idle', eveH: 0,
    folios: [
      { id: 1, school: 'moon', seals: [], slot: 0 },
      { id: 2, school: 'leaf', seals: [], slot: 1 },
      { id: 3, school: 'moon', seals: [], slot: 3, done: true },
      { id: 4, school: 'leaf', seals: [], slot: 8, done: true },
    ] };
}
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.folios) { if (s.phase !== 'evening') s.phase = 'idle'; return s; } } catch (e) {} return null; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
let S = load() || fresh();
const T = { order: null, hand: null, from: 0, strokes: [], hit: 0, len: 0, sealed: 0, wob: false, drawing: false,
  raven: -1, ravenReady: false, dayT: S.phase === 'evening' ? 1 : S.done / 3 * .66, bubble: null,
  teapot: 0, fish: 0, whisper: null, cup: 0, wig: {}, px: 0, py: 0, parts: [], lastSeal: -1, pending: 0 };
let now = 0;

/* ---------- звук ---------- */
let AC = null, master, crackG, penG, purrG, muted = false;
function audioInit() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = AC.createGain(); master.gain.value = muted ? 0 : .6; master.connect(AC.destination);
  const buf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const mk = (type, freq, gain) => {
    const s = AC.createBufferSource(); s.buffer = buf; s.loop = true;
    const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = AC.createGain(); g.gain.value = gain; s.connect(f); f.connect(g); g.connect(master); s.start(); return g;
  };
  mk('lowpass', 380, .06); crackG = mk('highpass', 2600, 0); penG = mk('bandpass', 3200, 0);
  const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 46;
  const lf = AC.createBiquadFilter(); lf.type = 'lowpass'; lf.frequency.value = 200;
  purrG = AC.createGain(); purrG.gain.value = 0; o.connect(lf); lf.connect(purrG); purrG.connect(master); o.start();
  setPurr();
}
function setPurr() { if (AC) purrG.gain.setTargetAtTime(S.phase === 'evening' ? .09 : 0, AC.currentTime, .6); }
function chime(freqs, vol = .12) {
  if (!AC) return;
  freqs.forEach((f, i) => {
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + i * .09;
    o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + .9); o.connect(g); g.connect(master); o.start(t); o.stop(t + 1);
  });
}

/* ---------- помощники рисования ---------- */
function hex(c) { return [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; }
function sky3(m, s, n, t) { return t < .66 ? mix(m, s, t / .66) : mix(s, n, (t - .66) / .34); }
function ell(x, y, rx, ry, fill, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, 2 * PI); if (fill) { ctx.fillStyle = fill; ctx.fill(); } }
function rct(x, y, w, h, r, fill) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } }
function line(x1, y1, x2, y2, col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function glow(x, y, r, rgb, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
  ctx.globalCompositeOperation = 'source-over';
}
function drawSym(k, x, y, s, col) {
  ctx.save(); ctx.translate(x, y); ctx.fillStyle = col; ctx.beginPath();
  if (k === 'moon') { ctx.arc(0, 0, s, 1.1, 5.18); ctx.arc(.75 * s, 0, .94 * s, 4.388, 1.895, true); }
  else if (k === 'leaf') { ctx.moveTo(0, -s); ctx.quadraticCurveTo(s * 1.1, -s * .1, 0, s); ctx.quadraticCurveTo(-s * 1.1, -s * .1, 0, -s); }
  else if (k === 'flame') { ctx.moveTo(0, -s); ctx.bezierCurveTo(s * .2, -s * .3, s, 0, s * .7, s * .55); ctx.bezierCurveTo(s * .5, s * 1.1, -s * .5, s * 1.1, -s * .7, s * .55); ctx.bezierCurveTo(-s, 0, -s * .2, -s * .3, 0, -s); }
  else { for (let i = 0; i < 8; i++) { const a = i * PI / 4 - PI / 2, r = i % 2 ? s * .4 : s; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } }
  ctx.fill(); ctx.restore();
}
function drawFish(x, y, s, col, dir = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(dir * s, s);
  ell(0, 0, 16, 9, col);
  ctx.beginPath(); ctx.moveTo(-13, 0); ctx.lineTo(-26, -9); ctx.lineTo(-26, 9); ctx.fill();
  ell(8, -2, 2.4, 2.4, '#fff'); ell(8.6, -2, 1.2, 1.2, '#333'); ctx.restore();
}
function spark(x, y, col, n = 10, txt) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 2 * PI, v = 20 + Math.random() * 60;
    T.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, life: 0, max: .8 + Math.random() * .8, col, txt, size: 3 + Math.random() * 3 });
  }
}
function floatText(x, y, txt, col = '#ffe9a0', size = 26) { T.parts.push({ x, y, vx: 0, vy: -28, life: 0, max: 2, col, txt, size, g: 0 }); }

/* ---------- полка ---------- */
const SHX = 60, SHB = 548, ROWH = 92;
const rows = () => S.level + 1, cap = () => rows() * 6;
function slotRect(i) { const r = Math.floor(i / 6), c = i % 6; return { x: SHX + 20 + c * 60, y: SHB - (r + 1) * ROWH + 14, w: 52, h: ROWH - 22 }; }
function slotAt(x, y) { for (let i = 0; i < cap(); i++) { const s = slotRect(i); if (x >= s.x - 4 && x <= s.x + s.w + 4 && y >= s.y - 6 && y <= s.y + s.h + 4) return i; } return -1; }
const folioIn = i => S.folios.find(f => f.slot === i);
function neighbours(f) {
  let n = 0; const c = f.slot % 6;
  for (const d of [-1, 1]) { if (c + d < 0 || c + d > 5) continue; const g = folioIn(f.slot + d); if (g && g.school === f.school) n++; }
  return n;
}
function harmony() { let n = 0; for (const f of S.folios) { if (f.slot == null || f.slot % 6 === 5) continue; const g = folioIn(f.slot + 1); if (g && g.school === f.school) n++; } return n; }
function freeSlot() { for (let i = 0; i < cap(); i++) if (!folioIn(i)) return i; return -1; }
function spawnBlank(school) {
  let i = freeSlot();
  if (i < 0) {
    const old = S.folios.filter(f => f.done).sort((a, b) => a.id - b.id)[0];
    if (old) { i = old.slot; S.folios.splice(S.folios.indexOf(old), 1); toast('Полки полны. Самый старый фолиант взмахнул обложкой и улетел в архив.'); }
    else return;
  }
  S.folios.push({ id: S.nid++, school, seals: [], slot: i });
  const s = slotRect(i); spark(s.x + 26, s.y + 35, SCHOOLS[school].col, 14);
}
function drawSpine(f, x, y, w, h) {
  const sc = SCHOOLS[f.school], hh = h - (f.id * 7 % 3) * 5, yy = y + h - hh;
  ctx.save();
  if (T.whisper && T.whisper.id === f.id) { ctx.translate(x + w / 2, y + h); ctx.rotate(Math.sin(now * 14) * .06); ctx.translate(-x - w / 2, -y - h); }
  rct(x + 5, yy, w - 10, hh, 5, sc.col);
  ctx.fillStyle = 'rgba(0,0,0,.14)'; ctx.fillRect(x + 5, yy + 4, 5, hh - 8);
  ctx.fillStyle = f.done ? '#edcc6e' : sc.dark; ctx.fillRect(x + 5, yy + 8, w - 10, 4); ctx.fillRect(x + 5, yy + hh - 13, w - 10, 4);
  drawSym(f.school, x + w / 2 + 1, yy + hh * .42, 9, '#fff6dc');
  for (let i = 0; i < 3; i++) ell(x + w / 2 - 9 + i * 9 + 1, yy + hh - 22, 2.6, 2.6, (f.done || i < f.seals.length) ? '#ffe08a' : 'rgba(0,0,0,.25)');
  ctx.restore();
}
function drawShelf() {
  const n = rows(), top = SHB - n * ROWH - 12;
  rct(SHX, top, 400, n * ROWH + 14, 8, '#5a3d28');
  for (let r = 0; r < n; r++) {
    const y = SHB - (r + 1) * ROWH;
    rct(SHX + 12, y + 4, 376, ROWH - 12, 3, '#3a281d');
    ctx.fillStyle = '#7b5333'; ctx.fillRect(SHX + 8, y + ROWH - 8, 384, 8);
  }
  const placing = S.phase === 'place' || S.phase === 'move';
  for (let i = 0; i < cap(); i++) {
    const s = slotRect(i), f = folioIn(i);
    if (placing) { ctx.setLineDash([5, 6]); ctx.strokeStyle = `rgba(255,233,160,${.35 + .2 * Math.sin(now * 3)})`; ctx.lineWidth = 2; rct(s.x + 3, s.y, s.w - 6, s.h, 6); ctx.stroke(); ctx.setLineDash([]); }
    if (!f) continue;
    if (S.phase === 'pick' && T.order && f.school === T.order.school && !f.done) {
      ctx.save(); ctx.shadowColor = '#ffe9a0'; ctx.shadowBlur = 14 + 8 * Math.sin(now * 4); drawSpine(f, s.x, s.y, s.w, s.h); ctx.restore();
    }
    drawSpine(f, s.x, s.y, s.w, s.h);
  }
  if (S.level >= 3) { // лестница
    line(456, 548, 436, 150, '#8a6233', 5); line(486, 548, 466, 150, '#8a6233', 5);
    for (let i = 0; i < 9; i++) { const y = 520 - i * 42, o = (548 - y) / 398 * 20; line(457 - o, y, 485 - o, y, '#8a6233', 4); }
  }
}

/* ---------- сцена ---------- */
const STONES = Array.from({ length: 46 }, () => [Math.random() * W, 30 + Math.random() * 520, 40 + Math.random() * 50, 22 + Math.random() * 16]);
const STARS = Array.from({ length: 22 }, () => [(Math.random() - .5) * 180, (Math.random() - .7) * 130, Math.random() * 6]);
const night = () => clamp((T.dayT - .66) / .34, 0, 1);

function drawRoom() {
  const g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, '#54433a'); g.addColorStop(.25, '#6b5648'); g.addColorStop(.8, '#74594a'); g.addColorStop(1, '#5a463b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 560);
  ctx.strokeStyle = 'rgba(0,0,0,.09)'; ctx.lineWidth = 2;
  for (const s of STONES) { rct(s[0], s[1], s[2], s[3], 8); ctx.stroke(); }
  rct(950, 20, 160, 300, 0, '#7a6454');
  // пол
  ctx.fillStyle = '#7a5639'; ctx.fillRect(0, 560, W, 160);
  ctx.strokeStyle = 'rgba(0,0,0,.14)'; ctx.lineWidth = 2;
  for (let i = 0; i < 4; i++) { const y = 560 + i * 40; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); for (let x = (i % 2) * 90; x < W; x += 180) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 40); ctx.stroke(); } }
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(0, 556, W, 6);
  rct(0, 0, W, 26, 0, '#5a3d28'); ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(0, 22, W, 4);
}
function drawWindow() {
  const cx = 640, cy = 185, r = 95, t = T.dayT, n = night();
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * PI); ctx.clip();
  const g = ctx.createLinearGradient(0, cy - r, 0, cy + r);
  g.addColorStop(0, sky3('#bfe0ea', '#e9a777', '#1b2147', t)); g.addColorStop(1, sky3('#fbe6c2', '#f7d49a', '#3a3f73', t));
  ctx.fillStyle = g; ctx.fillRect(cx - r, cy - r, 2 * r, 2 * r);
  if (n > 0) {
    ctx.fillStyle = '#fffadc';
    for (const s of STARS) { ctx.globalAlpha = n * (.5 + .5 * Math.sin(now * 2 + s[2])); ctx.fillRect(cx + s[0], cy + s[1], 2.4, 2.4); }
    ctx.globalAlpha = n; ell(cx + 42, cy - 46, 17, 17, '#fff4c8'); ell(cx + 49, cy - 50, 14, 14, sky3('#bfe0ea', '#e9a777', '#1b2147', t)); ctx.globalAlpha = 1;
  }
  if (n < 1) { const a = clamp(t / .66, 0, 1); ctx.globalAlpha = 1 - n; ell(cx - 60 + a * 110, cy - 55 + a * a * 75, 15, 15, '#fff0b0'); ctx.globalAlpha = 1; }
  const hill = (col, base, f, ph, amp) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(cx - r, cy + r); for (let x = -r; x <= r; x += 8) ctx.lineTo(cx + x, cy + base + Math.sin(x / f + ph) * amp); ctx.lineTo(cx + r, cy + r); ctx.fill(); };
  hill(sky3('#a5c986', '#b0a866', '#2d4a4a', t), 34, 38, 1, 12);
  ctx.fillStyle = '#8a6a52'; ctx.fillRect(cx - 16, cy + 36, 6, 12);
  for (let i = 0; i < 3; i++) { const p = (now * .15 + i / 3) % 1; ell(cx - 13 + p * 12, cy + 34 - p * 30, 3 + p * 4, 3 + p * 4, `rgba(255,255,255,${.5 * (1 - p)})`); }
  hill(sky3('#7fae5e', '#8c9a4c', '#22393b', t), 60, 50, -1, 14);
  ell(cx - 28, cy + 62, 13, 13, '#c98a45'); ctx.strokeStyle = '#7a4c22'; ctx.lineWidth = 2.5; ctx.stroke();
  ell(cx - 23, cy + 62, 1.8, 1.8, '#ffe08a');
  ell(cx + 30, cy + 70, 6, 5, n > .5 ? '#ffd98a' : '#e8d9a8');
  if (T.fish > 0) { const p = T.fish / 8; drawFish(cx - r - 40 + p * (2 * r + 80), cy - 15 + Math.sin(now * 2) * 9, 1.5, '#f0a070'); }
  ctx.restore();
  ctx.lineWidth = 13; ctx.strokeStyle = '#6e4a2e'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * PI); ctx.stroke();
  ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r); ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy); ctx.stroke();
  rct(528, 282, 224, 13, 5, '#7b5333');
}
function drawDecor() {
  if (S.level >= 2) {
    for (const [x, l] of [[250, 46], [285, 58], [320, 42]]) { line(x, 26, x, 26 + l, '#8a6a52', 2); ell(x, 34 + l, 9, 15, '#7d9a5c'); ell(x - 4, 40 + l, 5, 10, '#93ad6b'); }
    line(830, 26, 830, 62, '#3a2a22', 2); rct(818, 62, 24, 30, 5, '#6e4a2e'); rct(822, 67, 16, 20, 3, '#ffd98a');
  }
  if (S.level >= 3) {

function openOrder() {

function choose(f) {

function madness(wob) {

  if (k === 'teapot') { T.teapot = .01; toast(pre + 'чайник отрастил ножки и пошёл гулять.'); }
  if (k === 'fish') { T.fish = .01; toast(pre + 'за окном проплыла рыба.'); }
  if (k === 'whisper') { T.whisper = { id: pick(S.folios).id, t: 6 }; toast(pre + 'один из фолиантов начал шептать.'); }
  if (k === 'cup') { T.cup = .01; toast(pre + 'кот решил, что чашке на столе не место.'); }
}
function checkHit(x, y) {
  if (T.sealed) return; const pts = T.order.seal.pts, p = pts[T.hit];
  if (dist(x, y, BX + p[0] * BR, BY + p[1] * BR) > 28) return;

  if (T.hit < pts.length) return;

  chime([523, 659, 784, 1047]); spark(BX, BY, SCHOOLS[T.order.school].col, 26);

function poke(x, y) {
  if (S.phase === 'evening') { if (dist(x, y, 1010, 625) < 80) { floatText(x, y - 20, '♥', '#f2a0b4', 24); chime([196], .05); } return; }
  if (dist(x, y, 660, 380) < 62) { say(pick(['Мяу.', 'Мрр?', 'Я занят. Почти.', 'Перо не трогать.', 'Шляпа настоящая.'])); floatText(660, 300, '♥', '#f2a0b4', 22); return; }
  if (dist(x, y, 1030, 500) < 70) { spark(1030, 500, '#ffb45a', 8); return; }

    if (i === 6) { T.wig.tele = 1; toast('В телескоп видно: холм, ещё холм, и кто-то машет.'); }

}
function onDown(x, y) {

}
function onMove(x, y) {
  T.px = x; T.py = y;
  if (S.phase !== 'draw' || !T.drawing) return;
  const st = T.strokes[T.strokes.length - 1], l = st[st.length - 1], d = dist(x, y, l[0], l[1]);
  if (d < 3) return;
  st.push([x, y]); if (T.hit > 0) T.len += d;
  if (AC) penG.gain.setTargetAtTime(Math.min(.14, d * .012), AC.currentTime, .02);

const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); onDown(...pos(e)); });
cv.addEventListener('pointermove', e => onMove(...pos(e)));
window.addEventListener('pointerup', () => { T.drawing = false; });

$('bArt').onclick = () => { audioInit(); const c = artCost(); if (S.dust < c || S.arts >= ARTS.length) return; S.dust -= c; const a = ARTS[S.arts++]; toast('Новый артефакт: ' + a.n + '.'); spark(a.x, a.y, '#ffe08a', 22); chime([659, 784, 988]); save(); ui(); };
$('bTower').onclick = () => { audioInit(); if (S.level >= 3 || S.dust < TOWER_COST[S.level - 1]) return; S.dust -= TOWER_COST[S.level - 1]; S.level++; const sc = LEVEL_SCHOOL[S.level]; spawnBlank(sc); toast(`Башня подросла! В библиотеке новая полка и школа ${SCHOOLS[sc].name}.`); spark(250, SHB - rows() * ROWH + 40, '#ffe08a', 30); chime([392, 523, 659, 784, 1047]); save(); ui(); };
$('bMute').onclick = () => { audioInit(); muted = !muted; if (master) master.gain.value = muted ? 0 : .6; ui(); };
$('bReset').onclick = () => { if (!confirm('Начать заново? Башня и фолианты исчезнут.')) return; S = fresh(); Object.assign(T, { order: null, hand: null, raven: -1, ravenReady: false, pending: 0, teapot: 0, fish: 0, cup: 0, whisper: null }); save(); ui(); };

/* ---------- цикл ---------- */
function update(dt) {
  now += dt;
  const target = S.phase === 'evening' ? 1 : S.done / 3 * .66; T.dayT += (target - T.dayT) * Math.min(1, dt * .9);
  if (S.phase !== 'evening' && !T.pending) { T.raven += dt; if (T.raven >= 1 && !T.ravenReady) { T.ravenReady = true; ui(); } }
  if (T.sealed) { T.sealed += dt; if (T.sealed > 1.7) { const w = T.wob; T.sealed = 0; S.phase = 'place'; ui(); if (w || Math.random() < .2) madness(w); } }

  if (T.fish) { T.fish += dt; if (T.fish > 8) T.fish = 0; }
  if (T.cup) { T.cup += dt; if (T.cup > 8) { T.cup = 0; spark(768, 458, '#fff6dc', 6); } }

}
function draw() {
  drawRoom(); drawWindow(); drawDecor(); drawShelf(); drawFireplace(); drawFloorThings();
  if (S.phase === 'evening') drawCatSleeping(); else drawCat();
  drawDesk(); drawSill(); drawLight(); drawBubble(); drawHUD();

let K = 1;
function resize() {

ui(); requestAnimationFrame(frame);
